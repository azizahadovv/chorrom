# CHORROM: to'liq stek Docker'da. Ishga tushirish: bash deploy/deploy.sh (README.md)
#   db      — PostgreSQL (port ochmaydi)
#   api     — Java API (port ochmaydi, faqat web orqali)
#   builder — bir martalik: sahifalarni API ma'lumoti bilan oldindan chizadi va web_dist'ga yozadi
#   web     — nginx: sayt, /uploads, /api → api (127.0.0.1:WEB_PORT)
#   caddy   — HTTPS (Let's Encrypt, 80/443). Faqat server bo'sh bo'lsa; 80-portda boshqa nginx bo'lsa kerak emas.
# Serverda boshqa loyihalar bo'lishi mumkin: tashqi port faqat caddy'da, xotira chegaralangan.
name: chorrom

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chorrom
      POSTGRES_USER: chorrom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da bo'lishi kerak}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorrom -d chorrom"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    image: chorrom-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/chorrom
      DB_USER: chorrom
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da bo'lishi kerak (kamida 32 belgi)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      UPLOAD_DIR: /data/uploads
      UPLOAD_URL: /uploads
      IMPORT_SUPABASE_URL: ${IMPORT_SUPABASE_URL:-}
      IMPORT_SUPABASE_KEY: ${IMPORT_SUPABASE_KEY:-}
    volumes:
      - uploads:/data/uploads
    # O'lchangan eng og'ir holat (import + 4 ta 12 MP rasm bir vaqtda): 577 MB
    mem_limit: 768m

  builder:
    profiles: ["build"]
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: builder
    image: chorrom-builder:latest
    environment:
      PRERENDER_API_URL: http://api:8080
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - web_dist:/out
    mem_limit: 1536m

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: web
    image: chorrom-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - web_dist:/usr/share/nginx/html:ro
      - uploads:/srv/uploads:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    profiles: ["https"]
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      target: caddy
    image: chorrom-caddy:latest
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-chorrom.uz}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    mem_limit: 128m

volumes:
  pgdata:
  uploads:
  web_dist:
  caddy_data:
  caddy_config:

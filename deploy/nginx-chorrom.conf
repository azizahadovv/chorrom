# /etc/nginx/sites-available/chorrom.conf  (sites-enabled'ga symlink qilinadi)
# Frontend: oldindan chizilgan sahifalar (WEB_ROOT). /api → Java API, /uploads → rasmlar papkasi.
# HTTPS: certbot --nginx -d chorrom.uz -d www.chorrom.uz  (sertifikatni certbot shu faylga qo'shadi)

server {
    listen 80;
    listen [::]:80;
    server_name chorrom.uz www.chorrom.uz;

    root /var/www/chorrom;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # www → asosiy domen
    if ($host = www.chorrom.uz) {
        return 301 https://chorrom.uz$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /srv/chorrom/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /katalog → katalog.html (oldindan chizilgan), qolgani (admin) → index.html
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}

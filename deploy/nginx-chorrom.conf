# Faqat serverda boshqa loyihalar uchun nginx allaqachon 80/443 da ishlayotgan bo'lsa kerak (bo'sh serverda Caddy ishlatiladi).
# /etc/nginx/sites-available/chorrom.conf  (sites-enabled'ga symlink qilinadi)
# HTTPS: certbot --nginx -d chorrom.uz -d www.chorrom.uz --redirect

server {
    listen 80;
    listen [::]:80;
    server_name chorrom.uz www.chorrom.uz;

    client_max_body_size 26m;

    # www → asosiy domen
    if ($host = www.chorrom.uz) {
        return 301 https://chorrom.uz$request_uri;
    }

    # WEB_PORT (deploy/.env, standart 8088)
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

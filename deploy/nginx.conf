# web konteyneri: oldindan chizilgan sayt, /uploads va /api. HTTPS tashqarida (caddy yoki host'dagi nginx).

map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/uploads/  "public, max-age=31536000, immutable";
    ~^/img/      "public, max-age=2592000";
    ~^/api/      "";
    default      "no-cache";
}

# Admin SVG ham yuklay oladi: brauzerda ochilsa ichidagi skript ishlamasin
map $uri $uploads_csp {
    ~^/uploads/  "sandbox; default-src 'none'; style-src 'unsafe-inline'";
    default      "";
}

# Tashqi proksi (caddy yoki host nginx) HTTPS'ni bilgan; to'g'ridan-to'g'ri so'rovda o'zimizniki
map $http_x_forwarded_proto $forwarded_proto {
    ""       $scheme;
    default  $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API'dagi multipart chegarasi 25 MB
    client_max_body_size 26m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Haqiqiy mijoz IP'si (arizalar uchun spam chegarasi shunga qaraydi): faqat Docker tarmog'idagi proksiga ishoniladi
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header Cache-Control $cache_control;
    add_header Content-Security-Policy $uploads_csp;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ /\. {
        return 404;
    }

    location /api/ {
        # Docker DNS: api konteyneri qayta yaratilsa yangi IP'si topiladi (nginx qayta yuklanmaydi)
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Bitta qiymat: mijoz yuborgan soxta X-Forwarded-For spam chegarasini aylanib o'tolmaydi
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /srv/uploads/;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # /katalog → katalog/index.html (oldindan chizilgan), qolgani (admin) → index.html
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
